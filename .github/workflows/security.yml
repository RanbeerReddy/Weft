name: Security Scanning

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "0 2 * * 0"  # Weekly scan on Sunday at 2 AM UTC

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit Security Scan
        run: |
          bandit -r Weft/ \
            -f json \
            -o bandit-report.json \
            --severity-level medium
        continue-on-error: true

      - name: Display Bandit Results
        run: |
          if [ -f bandit-report.json ]; then
            python -m json.tool < bandit-report.json
          fi
        continue-on-error: true

      - name: Check for Vulnerable Dependencies
        run: |
          safety check \
            --json \
            --output safety-report.json \
            || true
        continue-on-error: true

      - name: Display Safety Results
        run: |
          if [ -f safety-report.json ]; then
            python -m json.tool < safety-report.json
          fi
        continue-on-error: true

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 30

      - name: Fail if critical issues found
        run: |
          if grep -q '"severity": "HIGH"' bandit-report.json 2>/dev/null || \
             grep -q '"severity": "CRITICAL"' bandit-report.json 2>/dev/null; then
            echo "⚠️ Critical or High security issues found!"
            exit 1
          fi
        continue-on-error: true