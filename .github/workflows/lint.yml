name: Lint

on:
    push:
    pull_request:

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: 3.11

            - run: |
                pip install black==25.1.0 ruff mypy

            - run: black --check .
            - run: ruff check .
            - run: mypy Weft