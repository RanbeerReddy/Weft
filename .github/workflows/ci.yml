name: CI Pipeline

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.11"]
        
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: weft_user
                    POSTGRES_PASSWORD: weft_123
                    POSTGRES_DB: weft_db
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: ${{ matrix.python-version }}

            - name: Cache pip
              uses: actions/cache@v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
                restore-keys: |
                  ${{ runner.os }}-pip-
                
            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install pytest pytest-cov pytest-asyncio

            - name: Run Linters & Formatters
              run: |
                black --check Weft tests
                isort --check Weft tests
                ruff check Weft tests
                mypy Weft

            - name: Initialize Database Schema (Alembic)
              env:
                TEST_DATABASE_URL: postgresql+psycopg2://weft_user:weft_123@localhost:5432/weft_db
              run: |
                alembic upgrade head

            - name: Run Unit Tests
              run: |
                pytest tests/ -m unit -v

            - name: Run Integration Tests
              env:
                TEST_DATABASE_URL: postgresql+psycopg2://weft_user:weft_123@localhost:5432/weft_db
              run: |
                pytest tests/ -m integration -v --cov=Weft --cov-report=term-missing --cov-report=xml

            - name: Upload Coverage Reports
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: coverage-reports
                path: coverage.xml