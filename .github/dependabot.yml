version: 2

updates:
  # Python package dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "ranbe"
    labels:
      - "dependencies"
      - "automated"
    pull-request-branch-name:
      separator: "/"
      prefix: "dependabot"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    allow:
      - dependency-type: "all"
    ignore:
      # Add any problematic dependencies here to ignore updates
      # - dependency-name: "package-name"
