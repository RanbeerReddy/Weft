version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: weft-postgres
    restart: always
    environment:
      POSTGRES_USER: weft_user
      POSTGRES_PASSWORD: weft_123

      POSTGRES_DB: weft_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: